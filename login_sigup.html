```html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>B&B AI - Enter</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            font-family: Arial, sans-serif;
            background: #08080f;
            color: white;

            display: flex;
            align-items: center;
            justify-content: center;

            padding: 25px;
        }

        .box {
            width: 100%;
            max-width: 430px;
            padding: 40px;

            background: #101019;
            border: 1px solid #242432;
            border-radius: 20px;
        }

        .logo {
            display: block;
            text-align: center;

            color: white;
            text-decoration: none;

            font-size: 28px;
            font-weight: bold;

            margin-bottom: 35px;
        }

        .logo span {
            color: #9b7cff;
        }

        h1 {
            text-align: center;
            margin-bottom: 10px;
        }

        .subtitle {
            text-align: center;
            color: #9292a1;
            margin-bottom: 30px;
        }

        label {
            display: block;
            color: #c2c2ce;
            font-size: 13px;
            margin-bottom: 8px;
        }

        input {
            width: 100%;
            padding: 14px;

            margin-bottom: 18px;

            background: #08080f;
            color: white;

            border: 1px solid #292936;
            border-radius: 10px;

            outline: none;
        }

        input:focus {
            border-color: #9b7cff;
        }

        button {
            width: 100%;
            padding: 15px;

            border: none;
            border-radius: 11px;

            background: white;
            color: #08080f;

            font-weight: bold;
            font-size: 15px;

            cursor: pointer;
        }

        .back {
            display: block;
            text-align: center;

            margin-top: 22px;

            color: #888896;
            text-decoration: none;
            font-size: 13px;
        }

        .back:hover {
            color: white;
        }
    </style>
</head>

<body>

<div class="box">

    <a href="index.html" class="logo">
        B&B <span>AI</span>
    </a>

    <h1>Enter B&B AI</h1>

    <p class="subtitle">
        Sign in or create your account
    </p>

    <form>

        <label for="email">
            Email
        </label>

        <input
            id="email"
            type="email"
            placeholder="you@example.com"
            required
        >

        <label for="password">
            Password
        </label>

        <input
            id="password"
            type="password"
            placeholder="Your password"
            required
        >

        <button type="submit">
            Continue
        </button>

    </form>

    <a href="index.html" class="back">
        ← Back to B&B AI
    </a>

</div>

</body>
</html>
```
